<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FlavorFlow | Feedback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">

    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "inverse-primary": "#6ee7b7",
          "tertiary-fixed-dim": "#c4c7c9",
          "surface-container-lowest": "#ffffff",
          "on-surface": "#0b1f16",
          "primary": "#047857",
          "on-tertiary-container": "#f6f8fa",
          "primary-fixed-dim": "#a7f3d0",
          "tertiary-container": "#6f7274",
          "on-error": "#ffffff",
          "inverse-on-surface": "#ecfdf5",
          "secondary-container": "#dfe0e0",
          "surface-variant": "#d1f0df",
          "on-primary": "#ffffff",
          "error": "#ba1a1a",
          "secondary-fixed-dim": "#c6c6c7",
          "outline-variant": "#cfe8dc",
          "on-secondary-container": "#616363",
          "tertiary-fixed": "#e0e3e5",
          "on-secondary-fixed": "#1a1c1c",
          "on-secondary": "#ffffff",
          "secondary": "#5d5f5f",
          "on-tertiary-fixed-variant": "#444749",
          "surface-container-highest": "#d1f0df",
          "tertiary": "#565a5b",
          "on-secondary-fixed-variant": "#454747",
          "secondary-fixed": "#e2e2e2",
          "on-primary-fixed": "#064e3b",
          "surface-bright": "#fbfefc",
          "on-background": "#0b1f16",
          "on-primary-fixed-variant": "#065f46",
          "surface-container": "#e8f8ef",
          "background": "#f6fbf8",
          "outline": "#6b8f7d",
          "primary-container": "#059669",
          "on-tertiary-fixed": "#191c1e",
          "on-primary-container": "#ffffff",
          "surface-dim": "#d5e9de",
          "on-tertiary": "#ffffff",
          "primary-fixed": "#d1fae5",
          "surface-tint": "#059669",
          "surface-container-low": "#f0fdf6",
          "on-error-container": "#93000a",
          "surface": "#fbfefc",
          "inverse-surface": "#0f3d2e",
          "error-container": "#ffdad6",
          "on-surface-variant": "#4b6b5c",
          "surface-container-high": "#dcf5e6"
        },
        "borderRadius": {
          "DEFAULT": "0.25rem",
          "lg": "0.5rem",
          "xl": "0.75rem",
          "full": "9999px"
        },
        "spacing": {
          "gutter": "16px",
          "lg": "32px",
          "xs": "8px",
          "margin-mobile": "16px",
          "xl": "48px",
          "md": "24px",
          "margin-desktop": "48px",
          "sm": "16px",
          "base": "4px"
        },
        "fontFamily": {
          "headline-md": ["Inter"],
          "headline-lg-mobile": ["Inter"],
          "display-lg": ["Inter"],
          "headline-lg": ["Inter"],
          "body-lg": ["Inter"],
          "label-md": ["Inter"],
          "body-md": ["Inter"],
          "label-sm": ["Inter"]
        },
        "fontSize": {
          "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
          "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
          "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
          "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
          "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}]
        }
      }
    }
  };
</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .star-filled {
            font-variation-settings: 'FILL' 1;
        }
        .modal-overlay {
            background-color: rgba(17, 28, 45, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface min-h-screen flex items-center justify-center p-md">
<!-- TopNavBar (Hidden for Modal focus as per UX Goal) -->
<!-- The user is in a focused journey (Feedback Modal), Shell is suppressed to prioritize content canvas -->
<!-- Main Content Canvas -->
<div class="fixed inset-0 modal-overlay z-10 flex items-center justify-center animate-in fade-in duration-300">
<!-- Feedback Dialog Card -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-xl shadow-xl border border-outline-variant overflow-hidden transform scale-100 transition-transform duration-200">
<!-- Header Section -->
<div class="px-lg pt-lg pb-md flex flex-col items-center text-center">
<div class="mb-md w-16 h-16 bg-primary-fixed flex items-center justify-center rounded-full text-on-primary-fixed-variant">
<span class="material-symbols-outlined text-[32px]">rate_review</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Share your experience</h1>
<p id="order-label" class="font-label-md text-label-md text-primary mb-xs"></p>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm">
                    How was your FlavorFlow experience today? Your feedback helps us maintain our premium logistics standard.
                </p>
</div>
<form class="px-lg pb-lg" id="feedbackForm">
<!-- Rating Component -->
<div class="flex flex-col items-center gap-xs mb-lg">
<span class="font-label-md text-label-md text-on-surface-variant">Tap to rate</span>
<div class="flex gap-xs" id="starContainer">
<button class="star-btn transition-transform active:scale-90 text-primary-container" data-rating="1" type="button">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 text-primary-container" data-rating="2" type="button">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 text-primary-container" data-rating="3" type="button">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 text-primary-container" data-rating="4" type="button">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
<button class="star-btn transition-transform active:scale-90 text-primary-container" data-rating="5" type="button">
<span class="material-symbols-outlined text-[40px]">star</span>
</button>
</div>
</div>
<!-- Text Area for Comments -->
<div class="space-y-xs mb-xl">
<label class="font-label-md text-label-md text-on-surface-variant block" for="comments">
                        Tell us more (Optional)
                    </label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-body-md placeholder:text-outline outline-none resize-none" id="comments" name="comments" placeholder="What did you enjoy? What could we improve?" rows="4"></textarea>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-sm items-center">
<button id="cancel-btn" class="w-full sm:w-1/3 py-sm px-md text-primary font-label-md text-label-md hover:bg-surface-container transition-colors rounded-lg active:scale-95" type="button">
                        Cancel
                    </button>
<button id="submit-btn" class="w-full sm:w-2/3 py-sm px-md bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg shadow-sm hover:shadow-md transition-all active:scale-95" type="submit">
                        Submit Feedback
                    </button>
</div>
</form>
<!-- Branding Subtle -->
<div class="px-lg py-sm bg-surface-container-low border-t border-outline-variant flex justify-center items-center gap-xs">
<span class="font-headline-md text-label-sm text-primary tracking-tight">FlavorFlow</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Premium Logistics</span>
</div>
</div>
</div>
<!-- Success Toast (Hidden by default) -->
<div class="fixed bottom-lg left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-md py-sm rounded-lg shadow-xl flex items-center gap-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50" id="successToast">
<span class="material-symbols-outlined text-primary-fixed">check_circle</span>
<span class="font-label-md text-label-md">Thank you for your feedback!</span>
</div>
<script>
    fetch('api/session').then(res => {
  if (res.status === 401) location.href = 'login.html';
});
  const orderId = new URLSearchParams(location.search).get('order_id');
  const stars = document.querySelectorAll('#starContainer .star-btn');
  const toast = document.getElementById('successToast');
  const submitBtn = document.getElementById('submit-btn');
  const submitHtml = submitBtn.innerHTML;
  let currentRating = 0;

  function paintStars(rating) {
    stars.forEach((star, index) => {
      const icon = star.querySelector('.material-symbols-outlined');
      const on = index < rating;
      icon.style.fontVariationSettings = on ? "'FILL' 1" : "'FILL' 0";
      star.classList.toggle('text-primary-container', on);
      star.classList.toggle('text-outline-variant', !on);
    });
  }

  stars.forEach((star, index) => {
    star.addEventListener('mouseenter', () => paintStars(index + 1));
    star.addEventListener('mouseleave', () => paintStars(currentRating));
    star.addEventListener('click', () => {
      currentRating = index + 1;
      paintStars(currentRating);
    });
  });

  document.getElementById('cancel-btn').addEventListener('click', () => {
    location.href = 'tracking.html?order_id=' + encodeURIComponent(orderId || '');
  });

  if (!orderId) {
    document.getElementById('order-label').textContent = 'No order selected';
    submitBtn.disabled = true;
  } else {
    document.getElementById('order-label').textContent = 'Order #FF-' + orderId;

    // Check that this order can be reviewed before showing the form
    fetch('api/feedback?order_id=' + encodeURIComponent(orderId))
      .then(res => res.json().then(body => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) throw new Error(body.error || 'Could not load order');
        if (!body.can_review) {
          const msg = body.already_reviewed
            ? 'You have already reviewed this order.'
            : 'Feedback is available after your order is delivered.';
          document.getElementById('order-label').textContent = msg;
          submitBtn.disabled = true;
        }
      })
      .catch(err => {
        document.getElementById('order-label').textContent = err.message;
        submitBtn.disabled = true;
      });
  }

  document.getElementById('feedbackForm').addEventListener('submit', e => {
    e.preventDefault();
    if (currentRating < 1) {
      alert('Please tap a star rating first.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const body = new URLSearchParams({
      order_id: orderId,
      rating: currentRating,
      comments: document.getElementById('comments').value
    });

    fetch('api/feedback', { method: 'POST', body })
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) throw new Error(data.error || 'Could not save feedback');
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          location.href = 'tracking.html?order_id=' + encodeURIComponent(orderId);
        }, 1500);
      })
      .catch(err => {
        alert('Error: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = submitHtml;
      });
  });
</script>
</body></html>
