<body class="bg-background text-on-background font-body-md text-body-md" >

<!-- Main Content Canvas -->
<main class="relative z-10 flex min-h-screen items-center justify-center p-gutter">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_24px_48px_rgba(0,0,0,0.06)] border border-outline-variant overflow-hidden flex flex-col">
<!-- Brand Header -->
<div class="p-lg pb-md text-center">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container text-on-primary-container rounded-lg mb-sm">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">FlavorFlow</h1>
<p class="font-body-md text-on-surface-variant mt-xs">Sign in to your professional account</p>
</div>
<!-- Login Form -->
<form class="px-lg pb-lg space-y-md" id="loginForm">
  <!-- Full name (register mode only) -->
<div id="name-field" class="hidden space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant block" for="fullname">Full Name</label>
<input class="w-full px-sm py-sm rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="fullname" placeholder="e.g. Alex Smith" type="text"/>
</div>
<!-- Identifier Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant block" for="identifier">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">alternate_email</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" id="identifier" name="identifier" placeholder="e.g. alex.smith@example.com" required="" type="text"/>
</div>
</div>
<!-- Phone Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant block" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">phone</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" id="phone" name="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center gap-xs">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Remember this device</label>
</div>
<!-- Submit Button -->
 <p id="login-error" class="hidden text-label-md text-error"></p>
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-sm rounded-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-xs" type="submit">
<span>Log In to Dashboard</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Secure Footer -->
<div class="pt-sm flex flex-col items-center gap-xs border-t border-outline-variant/30 mt-md">
<div class="flex items-center gap-base text-outline text-label-sm">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
<span>Secure End-to-End Encryption</span>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant">
<span id="toggle-prompt">Don't have an account?</span>
<button id="toggle-link" type="button" class="text-primary font-bold hover:underline ml-xs">Register</button>
</p>

<!-- Footer Meta -->
<footer class="w-full px-lg py-md flex justify-between items-center text-outline text-label-sm hidden md:flex">
<p>© 2024 FlavorFlow . All rights reserved.</p>
<div class="flex gap-md">
</div>
</footer>
<script>
  let registerMode = false;
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('login-error');
  const submitBtn = form.querySelector('button[type="submit"]');
  const originalBtnHtml = submitBtn.innerHTML;
  const createBtnHtml = '<span>Create Account</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
  const nameField = document.getElementById('name-field');
  const fullNameInput = document.getElementById('fullname');
  const togglePrompt = document.getElementById('toggle-prompt');
  const toggleLink = document.getElementById('toggle-link');

  // Sets the mode explicitly, so repeated clicks can't cancel each other out
  function setMode(register) {
    registerMode = register;
    errorBox.classList.add('hidden');
    nameField.classList.toggle('hidden', !registerMode);
    fullNameInput.required = registerMode;
    submitBtn.innerHTML = registerMode ? createBtnHtml : originalBtnHtml;
    togglePrompt.textContent = registerMode ? 'Already have an account?' : "Don't have an account?";
    toggleLink.textContent = registerMode ? 'Log in' : 'Register';
  }

  toggleLink.addEventListener('click', e => {
    e.preventDefault();
    setMode(!registerMode);
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.classList.add('hidden');

    const fullname = fullNameInput.value;
    const email = document.getElementById('identifier').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;

    const url = registerMode ? 'api/register' : 'api/login';
    const body = registerMode
      ? new URLSearchParams({ name: fullname, email, phone, password })
      : new URLSearchParams({ email, phone, password });

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>' + (registerMode ? 'Creating account...' : 'Logging in...') + '</span>';

    fetch(url, { method: 'POST', body })
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) throw new Error(data.error || 'Something went wrong');
        submitBtn.innerHTML = '<span>Success</span>';
        setTimeout(() => { location.href = 'index.html'; }, 800);
      })
      .catch(err => {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = registerMode ? createBtnHtml : originalBtnHtml;
      });
  });

  // Show or hide the password (the eye button is the first button of type "button" in the form)
  const togglePass = form.querySelector('button[type="button"]');
  const passInput = document.getElementById('password');
  togglePass.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    togglePass.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
  });
</script>
<script>
  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hasPhrase(label, phrase) {
    return new RegExp('(^|\\s)' + escapeRe(phrase) + '($|\\s)').test(label);
  }
  function go(page) { return () => { location.href = page; }; }
  function soon(msg) { return () => alert(msg); }

  // Finds buttons and links by visible text and attaches an action.
  // Plain "#" links without a rule show "Coming soon".
  function wireButtons(rules) {
    document.querySelectorAll('button, a').forEach(el => {
            if (el.hasAttribute('onclick') || el.getAttribute('type') === 'submit') return;
      const label = el.textContent.replace(/\s+/g, ' ').trim();
      const rule = rules.find(([phrase]) => hasPhrase(label, phrase));
      if (rule) {
        el.addEventListener('click', e => { e.preventDefault(); rule[1](); });
      } else if (el.tagName === 'A' && el.getAttribute('href') === '#') {
        el.addEventListener('click', e => { e.preventDefault(); alert('Coming soon'); });
      }
    });
  }
</script>

</body></html>
