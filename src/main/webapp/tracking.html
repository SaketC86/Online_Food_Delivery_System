<body class="bg-surface text-on-surface">

</button>
<button class="flex flex-col items-center gap-base text-on-surface-variant">
<span class="material-symbols-outlined">favorite</span>
<span class="text-[10px]">Favorites</span>

<script>
    fetch('api/session').then(res => {
  if (res.status === 401) location.href = 'login.html';
});
  const orderId = new URLSearchParams(location.search).get('order_id');

  const STEPS = [
    { key: 'Placed', label: 'Order Placed', desc: 'Your order has been received' },
    { key: 'Preparing', label: 'Preparing', desc: 'The kitchen is crafting your meal' },
    { key: 'Out-for-delivery', label: 'Out for Delivery', desc: 'Your driver is on the way' },
    { key: 'Delivered', label: 'Delivered', desc: 'Enjoy your meal!' }
  ];

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function money(n) {
    return '₹' + Number(n).toFixed(2);
  }

      function timelineCard(idx, cancelled) {
    const wrapper = 'bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg md:p-xl shadow-sm min-h-[320px]';
    if (cancelled) {
      return `<div class="${wrapper}">
        <h3 class="text-headline-md font-headline-md mb-md">Delivery Status</h3>
        <p class="text-body-md text-error">This order was cancelled.</p>
      </div>`;
    }

    const pct = idx <= 0 ? 0 : (idx / (STEPS.length - 1)) * 100;
    const delivered = idx === STEPS.length - 1;

    const steps = STEPS.map((s, i) => {
      const done = i < idx;
      const current = i === idx;
      let dot;
      if (done) {
        dot = `<div class="z-10 w-6 h-6 rounded-full bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-white text-[16px]">check</span></div>`;
      } else if (current) {
        dot = `<div class="z-10 w-6 h-6 rounded-full bg-primary-container border-4 border-surface flex items-center justify-center">
          <div class="w-2 h-2 rounded-full bg-primary animate-ping"></div></div>`;
      } else {
        dot = `<div class="z-10 w-6 h-6 rounded-full bg-outline-variant flex items-center justify-center">
          <span class="w-2 h-2 rounded-full bg-surface"></span></div>`;
      }
      const faded = (done || current) ? '' : 'opacity-50';
      const labelColor = current ? 'text-primary' : 'text-on-surface';
      return `<div class="relative flex flex-col items-center text-center w-1/4 ${faded}">
        ${dot}
        <span class="mt-xs text-body-md font-semibold ${labelColor}">${s.label}</span>
        <span class="text-label-sm text-on-surface-variant max-w-[140px]">${s.desc}</span>
      </div>`;
    }).join('');
        const thankYou = delivered
      ? `<div class="mt-md p-md rounded-xl bg-primary-fixed border border-primary/20 text-center">
          <p class="font-headline-md text-headline-md text-on-surface">Thank you for ordering with FlavorFlow!</p>
          <p class="text-body-md text-on-surface-variant mt-xs">We hope you enjoyed your meal. Your feedback helps us serve you better.</p>
        </div>`
      : '';

    const feedbackButton = delivered
      ? `<a href="feedback.html?order_id=${encodeURIComponent(orderId)}"
           class="mt-md flex items-center justify-center gap-xs bg-primary text-white py-sm px-md rounded-lg font-label-md hover:bg-primary-container transition-all active:scale-95">
          <span class="material-symbols-outlined text-[20px]">rate_review</span>
          Leave feedback
        </a>`
      : '';

    return `<div class="${wrapper}">
      <h3 class="text-headline-md font-headline-md text-on-surface mb-md">Delivery Status</h3>
      <div class="relative flex justify-between items-start">
        <div class="absolute top-3 left-[12.5%] right-[12.5%] h-[2px] bg-outline-variant">
          <div class="h-full bg-primary" style="width: ${pct}%"></div>
        </div>
        ${steps}
      </div>
      ${thankYou}
      ${feedbackButton}
    </div>`;
  }

    function driverCard(agent) {
        const wrapper = 'bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg shadow-sm mt-auto';
    if (!agent) {
      return `<div class="${wrapper}">
        <p class="text-label-md text-on-surface-variant">A driver hasn't been assigned to this order yet.</p>
      </div>`;
    }
    return `<div class="${wrapper}">
      <h4 class="text-label-md font-bold text-on-surface">${escapeHtml(agent.name)}</h4>
      <p class="text-label-sm text-on-surface-variant">FlavorFlow Delivery Partner</p>
      <p class="text-label-sm font-semibold text-primary mt-base">${escapeHtml(agent.vehicle_no)}</p>
    </div>`;
  }

    function summaryCard(d) {
    const rows = d.items.map(i => `
      <div class="flex justify-between text-label-sm">
        <span class="text-on-surface-variant">${i.quantity}x ${escapeHtml(i.name)}</span>
        <span class="text-on-surface font-medium">${money(i.unit_price * i.quantity)}</span>
      </div>`).join('');

    return `<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm mb-md">
      <h5 class="text-label-md font-bold text-on-surface mb-sm">${escapeHtml(d.restaurant_name)}</h5>
      <div class="space-y-xs">
        ${rows}
        <div class="pt-xs border-t border-outline-variant flex justify-between text-label-md font-bold text-on-surface">
          <span>Total</span>
          <span>${money(d.total)}</span>
        </div>
      </div>
      <button onclick="location.href='confirmation.html?order_id=' + encodeURIComponent(orderId)"
              class="w-full mt-md flex items-center justify-center gap-xs border border-primary text-primary py-sm px-md rounded-xl font-label-md hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined">receipt_long</span>
        View Receipt
      </button>
    </div>`;
  }
    // Same photos as the home page. Keep these in sync with index.html.
  const prepImages = {
    'Wood Fire Pizzeria': 'images/pizza.jpeg',
    'Smokey Grill Burgers': 'images/burger.jpeg',
    'Dragon Wok': 'images/china.jpeg',
    'Sweet Affair Desserts': 'images/sweet.jpeg',
    'Filter Kaapi House': 'images/chai.jpeg',
    'Green Bowl Kitchen': 'images/salad.jpeg',
    'Thrissur Bakers': 'images/puff.jpeg',
    'Juice Junction': 'images/juice.jpeg'
  };
  const prepFallback = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';

  const PREP_TEXT = {
    'Placed': 'The restaurant has received your order and will start cooking shortly.',
    'Preparing': 'The kitchen is cooking your food right now.',
    'Out-for-delivery': 'Your food is packed and a driver is on the way.',
    'Delivered': 'Your order has been delivered. Enjoy your meal!',
    'Cancelled': 'This order was cancelled.'
  };

  let lastData = null;
  let prepOpen = false;

  function prepCard(d) {
    if (!d) return '';
    const img = prepImages[d.restaurant_name] || prepFallback;
    const items = d.items.map(i => i.quantity + 'x ' + escapeHtml(i.name)).join(', ');
    const text = PREP_TEXT[d.status] || '';
    return `
      <button onclick="togglePrep()"
              class="w-full flex items-center justify-between gap-sm bg-primary text-on-primary px-md py-sm rounded-xl font-label-md hover:bg-primary-container transition-colors">
        <span>${prepOpen ? 'Hide kitchen details' : 'Check how your order is getting prepared'}</span>
        <span class="material-symbols-outlined">${prepOpen ? 'expand_less' : 'expand_more'}</span>
      </button>
      ${prepOpen ? `
      <div class="mt-sm bg-surface-container-lowest border border-outline-variant rounded-2xl overflow-hidden shadow-sm">
        <div class="bg-surface-container-high overflow-hidden">
          <img class="w-full h-auto block" src="${img}" alt="${escapeHtml(d.restaurant_name)}">
        </div>
        <div class="p-md space-y-xs">
          <h4 class="font-headline-md text-headline-md">${escapeHtml(d.restaurant_name)} kitchen</h4>
          <p class="text-body-md text-on-surface-variant">${escapeHtml(text)}</p>
          <p class="text-label-sm text-on-surface-variant">Items: ${items}</p>
        </div>
      </div>` : ''}`;
  }

  function togglePrep() {
    prepOpen = !prepOpen;
    document.getElementById('prep-card').innerHTML = prepCard(lastData);
  }

  function render(d) {
        lastData = d;
    const idx = STEPS.findIndex(s => s.key === d.status);
    const cancelled = d.status === 'Cancelled';
    const label = cancelled ? 'Cancelled' : (idx >= 0 ? STEPS[idx].label : d.status);

    document.getElementById('page-title').textContent = 'Tracking Order #FF-' + d.order_id;
    document.getElementById('eta-line').innerHTML =
      'Status: <span class="text-primary font-semibold">' + escapeHtml(label) + '</span>';
    document.getElementById('status-pill').textContent = label;
    

    document.getElementById('timeline-card').innerHTML = timelineCard(idx, cancelled);
    document.getElementById('driver-card').innerHTML = driverCard(d.agent);
    document.getElementById('order-summary').innerHTML = summaryCard(d);
        document.getElementById('prep-card').innerHTML = prepCard(d);
  }

  function load() {
    if (!orderId) {
      document.getElementById('page-title').textContent = 'No order selected';
      document.getElementById('eta-line').textContent =
        'Place an order to start tracking it.';
      return;
    }

    fetch('api/tracking?order_id=' + encodeURIComponent(orderId))
      .then(res => res.json().then(body => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) throw new Error(body.error || 'Could not load order');
        render(body);
      })
      .catch(err => {
        document.getElementById('page-title').textContent = 'Error';
        document.getElementById('eta-line').textContent = err.message;
      });
  }

  load();
  setInterval(load, 15000); // refresh every 15 seconds
</script>
<script>
  function openLatestOrder(e) {
    if (e) e.preventDefault();
    fetch('api/customer')
      .then(res => {
        if (res.status === 401) { location.href = 'login.html'; return null; }
        return res.json();
      })
      .then(data => {
        if (!data) return;
        if (!data.orders || !data.orders.length) {
          alert('You have no orders yet.');
          return;
        }
        const latest = data.orders[0].order_id;
        const current = (typeof orderId !== 'undefined') ? orderId : null;
        if (current && String(current) === String(latest)) {
          alert("You're already viewing your latest order (#FF-" + latest + ").");
          return;
        }
        location.href = 'tracking.html?order_id=' + latest;
      })
      .catch(() => alert('Could not load your orders.'));
  }
</script>
<script>
  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hasPhrase(label, phrase) {
    return new RegExp('(^|\\s)' + escapeRe(phrase) + '($|\\s)').test(label);
  }
  function go(page) { return () => { location.href = page; }; }
  function soon(msg) { return () => alert(msg); }

  // Finds buttons and links by visible text and attaches an action.
  // Plain "#" links without a rule show "Coming soon".
  function wireButtons(rules) {
    document.querySelectorAll('button, a').forEach(el => {
            if (el.hasAttribute('onclick') || el.getAttribute('type') === 'submit') return;
      const label = el.textContent.replace(/\s+/g, ' ').trim();
      const rule = rules.find(([phrase]) => hasPhrase(label, phrase));
      if (rule) {
        el.addEventListener('click', e => { e.preventDefault(); rule[1](); });
      } else if (el.tagName === 'A' && el.getAttribute('href') === '#') {
        el.addEventListener('click', e => { e.preventDefault(); alert('Coming soon'); });
      }
    });
  }
</script>
