<style>
        body {
            background-color: #f9f9ff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .splash-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-animation {
            animation: fadeInScale 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            border-radius: 99px;
            margin-top: 32px;
        }

        .loader-progress {
            position: absolute;
            height: 100%;
            width: 30%;
            background: #0066ff;
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -30%; }
            100% { left: 100%; }
        }

        .tagline {
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.4s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-bg {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface">

<!-- Micro-interaction for cursor -->
<div class="fixed top-0 left-0 w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px] pointer-events-none z-0 -translate-x-1/2 -translate-y-1/2 transition-transform duration-300 ease-out" id="cursor-glow"></div>
<script>
        // Interactive cursor glow effect
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.transform = `translate(${e.clientX - 200}px, ${e.clientY - 200}px)`;
        });

        // Simulate a transition to the next screen (e.g., Home or Login)
        // Since this is a splash screen, we'd normally redirect after X seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('Splash sequence complete. Transitioning to Dashboard...');
                // In a real app: window.location.href = '/dashboard';
            }, 3000);
        });
    </script>
